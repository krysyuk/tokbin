name: CI

# Everyday checks run locally in the pre-commit hook (scripts/hooks/pre-commit).
# This workflow covers what a single machine cannot: the full OS x Python matrix.
# Run it by hand before a release; it also runs on release tags.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run python scripts/check_versions.py
      - run: uv build --all-packages

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mode: [full, core]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: sync (full)
        if: matrix.mode == 'full'
        run: uv sync --locked
      - name: sync (core, without tokenizers)
        if: matrix.mode == 'core'
        run: uv sync --locked --no-group full
      - run: uv run pytest
